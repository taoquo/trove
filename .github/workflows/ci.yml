name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # macos-14 is retired on GitHub's hosted runners; macos-latest is the supported arm64 image.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The checkers are part of the build, not optional tooling (AGENTS.md section 5). The part
      # that reads a captured window is skipped here: those pictures are made by a real build
      # and are not versioned, so --source-only drops exactly that pair. selfcheck and the
      # capture checks stay in the gate, which has both a window and the images.
      - name: Checkers
        run: |
          bash tools/check-text.sh
          bash tools/check-wiring.sh --source-only
          bash tools/selfcheck.sh --source-only

      - name: Format
        run: |
          out=$(find . -name '*.go' -not -path './.git/*' -not -path './build/*' -print0 | xargs -0 gofmt -l)
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet ./cmd/trove

      - name: Test
        run: |
          go test -count=1 -timeout 20m ./...
          go test -race -count=1 -timeout 20m ./...

      # Ten seconds of mutation, beside the gate's thirty. The gate is where a long run can
      # live; CI's job is to see that the corpus still finds something on a machine that did
      # not write the code. Only a failing input reaches testdata, so this leaves the tree clean.
      - name: Fuzz the page parser
        run: go test -count=1 -timeout 2m ./internal/xsource -run FuzzParsePage -fuzz FuzzParsePage -fuzztime 10s

      # Known vulnerabilities in the code this module actually calls. govulncheck reads the
      # call graph rather than the module list, so an advisory in a vendored path nothing
      # reaches is not a failure here.
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      # Report-only for now: the total is printed so a drop shows up in the log, and the 60%
      # floor becomes an enforced check once the number is comfortably above it. Enforcing it
      # today would either be silently true or would fail on the first day for work nobody has
      # done yet.
      - name: Coverage
        run: |
          go test -count=1 -timeout 20m -coverprofile=coverage.out ./... > /dev/null
          go tool cover -func=coverage.out | tail -1

      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/trove

  windows:
    # The app ships for Windows, and a build that only compiles on the machine that wrote it is
    # how a whole platform stops building unnoticed. NSIS and the installer are the release
    # job's business; this asks only whether the code compiles for windows/amd64.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile for Windows
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/trove
