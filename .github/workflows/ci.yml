name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: |
          out=$(find . -name '*.go' -not -path './.git/*' -print0 | xargs -0 gofmt -l)
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: MyGo vet
        run: go tool mygo vet ./cmd/trove

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/trove
