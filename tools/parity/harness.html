<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>parity-source</title>
    <link rel="stylesheet" href="/build/chrome-mv3/extension.css" />
    <style>
      html, body { margin: 0; height: 100%; }
      #__boxes { display: none; }
    </style>
  </head>
  <body>
    <!--
      The reference renderer.

      `tools/parity/render-source.mjs` serves the repository root and opens this
      page in headless Chrome. It seeds IndexedDB with `fixture.json`, stubs the
      two chrome APIs the options page touches, imports the real options bundle,
      and exposes the rendered box tree on #__boxes.

      Why this exists: the previous six rounds of UI work compared the native app
      against hand-taken screenshots of a browser window. Those pictures could not
      be reproduced, could not be measured, and had already drifted from `src/`.
      This page renders `src/` itself, at a chosen size, with a chosen dataset, so
      both sides of every comparison are produced by a command.
    -->
    <div id="root"></div>
    <pre id="__boxes"></pre>

    <script type="module">
      const params = new URLSearchParams(location.search)
      const state = params.get("state") || "workspace"

      const fixture = await (await fetch("/tools/parity/fixture.json")).json()

      // The options page reads settings through chrome.storage.local and falls
      // back to defaults when the API is absent. Stubbing it is enough to choose
      // the locale and the pane width; no other extension API is touched during
      // a render.
      const settings = {
        schemaVersion: 7,
        themePreference: "light",
        leftSidebarWidth: 280,
        rightSidebarWidth: 360,
        savedViews: [],
        ...fixture.settings
      }
      window.chrome = {
        storage: {
          local: {
            get: async (key) => ({ [key]: settings }),
            set: async () => {}
          }
        },
        runtime: {
          sendMessage: async () => ({}),
          onMessage: { addListener() {} },
          lastError: null
        }
      }

      const DB = "x-bookmark-manager"

      function openDb(version) {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB, version)
          request.onupgradeneeded = () => {
            const db = request.result
            const store = (name, options) => {
              if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, options)
            }
            store("bookmarks", { keyPath: "tweetId" })
            store("tags", { keyPath: "id" })
            store("bookmark-tags", { keyPath: "id" })
            store("sync-runs", { keyPath: "id" })
            store("raw-payloads", { keyPath: "tweetId" })
            store("tag-suggestions", { keyPath: "id" })
            store("llm-analysis", { keyPath: "bookmarkId" })
          }
          request.onsuccess = () => resolve(request.result)
          request.onerror = () => reject(request.error)
        })
      }

      function putAll(db, storeName, rows) {
        return new Promise((resolve, reject) => {
          if (!rows || rows.length === 0) return resolve()
          const tx = db.transaction(storeName, "readwrite")
          const store = tx.objectStore(storeName)
          rows.forEach((row) => store.put(row))
          tx.oncomplete = resolve
          tx.onerror = () => reject(tx.error)
        })
      }

      try {
        const db = await openDb(9)
        await putAll(db, "bookmarks", fixture.bookmarks)
        await putAll(db, "tags", fixture.tags)
        await putAll(db, "bookmark-tags", fixture.bookmarkTags)
        await putAll(db, "sync-runs", fixture.syncRuns)
        await putAll(db, "tag-suggestions", fixture.tagSuggestions)
      } catch (error) {
        document.title = "SEED FAIL " + error
      }

      await import("/build/chrome-mv3/options.js")

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
      const until = async (test, limit = 4000) => {
        const started = Date.now()
        while (Date.now() - started < limit) {
          if (test()) return true
          await wait(50)
        }
        return false
      }

      // The results grid is the last thing the first read produces; waiting for it
      // (rather than for any child of #root) is what makes the state hooks below
      // act on cards that exist.
      await until(() => document.querySelector("[data-testid=results-stack]") || document.querySelector(".options-result-card"))
      let diag = ""

      if (state === "detail") {
        const card = document.querySelector(".options-result-card")
        diag = card ? " card" : " NOCARD"
        if (card) card.click()
        const opened = await until(() => document.querySelector("[data-testid=workspace-detail-card]"))
        diag += opened ? " opened" : " NODETAIL"
        await wait(400)
      } else if (state === "settings") {
        document.querySelector("[data-testid=footer-settings-toggle]")?.click()
        await until(() => document.querySelector("[data-testid=workspace-settings]"))
        await wait(400)
      } else if (state === "list") {
        document.querySelector("[data-testid=view-toggle-list]")?.click()
        await wait(300)
      } else if (state === "dark") {
        // The theme is a setting, so the harness re-renders after flipping it. One click is
        // not enough: `getNextThemePreference` walks light -> system -> dark -> light, and the
        // fixture stores "light", so a single click lands on "system", which resolves to light
        // in a headless browser -- the first dark rendition was the light page compared against
        // the native app's dark one. Click until the document actually reports dark.
        for (let attempt = 0; attempt < 4; attempt++) {
          if (document.documentElement.dataset.theme === "dark") break
          document.querySelector("[data-testid=footer-theme-toggle]")?.click()
          await wait(300)
        }
        await wait(400)
      }

      await wait(500)

      // The native side of the rig measures text, not elements: MyGo's Tester reports the
      // box a label is drawn in. Comparing that against an element's box made every padded
      // widget look offset by its own padding -- the status badge read +22/+8 while both
      // sides drew it in the same place. So a text leaf also carries `tr`, the rect of its
      // text run, and compare.py prefers it.
      const textRect = (el) => {
        if (el.childElementCount > 0) return null
        if (!el.firstChild || el.firstChild.nodeType !== Node.TEXT_NODE) return null
        const range = document.createRange()
        range.selectNodeContents(el)
        const r = range.getBoundingClientRect()
        if (r.width <= 0 || r.height <= 0) return null
        return { x: r.x, y: r.y, w: r.width, h: r.height }
      }

      const boxes = []
      document.querySelectorAll("#root *").forEach((el) => {
        const rect = el.getBoundingClientRect()
        if (rect.width <= 0 || rect.height <= 0) return
        const box = {
          tag: el.tagName.toLowerCase(),
          cls: (el.className || "").toString().slice(0, 90),
          tid: el.getAttribute("data-testid"),
          t: (el.textContent || "").trim().slice(0, 80),
          x: Math.round(rect.x),
          y: Math.round(rect.y),
          w: Math.round(rect.width),
          h: Math.round(rect.height)
        }
        const tr = textRect(el)
        if (tr) box.tr = { x: tr.x, y: tr.y, w: tr.w, h: tr.h }
        boxes.push(box)
      })
      document.getElementById("__boxes").textContent = JSON.stringify(boxes)
      document.title = "DONE " + state + " " + boxes.length + diag
      window.__PARITY_READY__ = true
    </script>
  </body>
</html>
